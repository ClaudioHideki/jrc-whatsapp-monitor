name: Build JRC WhatsApp Monitor

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a imagem depois das validações
        type: boolean
        default: false
      source_sha:
        description: SHA completo da branch a validar
        type: string
        required: true
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/claudiohideki/jrc-whatsapp-monitor

    steps:
      - name: Conferir o commit da execução
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$SOURCE_SHA" = "$GITHUB_SHA"
          fi
          tag="v4-20260825-$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then tag="$tag-a$GITHUB_RUN_ATTEMPT"; fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir a imagem candidata
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Executar a suite PABX e WhatsApp na imagem
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$PWD/tests:/app/tests:ro" "$IMAGE:$IMAGE_TAG" \
            -m unittest discover -s tests -v

      - name: Verificar inicialização HTTP em ambiente isolado
        run: |
          container=$(docker run -d --network none \
            -e LOGIN_USER=ci-monitor -e LOGIN_PASSWORD=monitor-smoke-only \
            -e SECRET_KEY=isolated-monitor-smoke-test-only-2026 "$IMAGE:$IMAGE_TAG")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..25}; do
            if docker exec "$container" python -c 'from urllib.request import urlopen; response = urlopen("http://127.0.0.1:5000/login", timeout=2); assert response.status == 200'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Login no GHCR
        if: github.event_name == 'push' || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem validada
        if: github.event_name == 'push' || inputs.publish
        run: docker push "$IMAGE:$IMAGE_TAG"

      - name: Verificar a imagem publicada pelo digest
        if: github.event_name == 'push' || inputs.publish
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$digest"
          test "$(docker image inspect "$IMAGE@$digest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          printf 'Imagem: %s\nDigest: %s\nCommit: %s\n' "$IMAGE:$IMAGE_TAG" "$digest" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
